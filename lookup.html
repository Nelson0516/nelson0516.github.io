<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查找電腦 — 陳大文</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/members.css">
  <link rel="stylesheet" href="css/assets.css">
</head>
<body class="members-page assets-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">CW</span>
        <span class="brand-name">陳大文</span>
      </a>
      <nav class="site-nav" aria-label="主要選單">
        <a href="index.html">返首頁</a>
        <a href="assets.html">資產管理</a>
        <a href="lookup.html" aria-current="true">查找</a>
        <a href="account.html">會員中心</a>
        <a href="#" id="logout-link">登出</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap assets-main">
      <div class="page-head">
        <div>
          <h1>查找電腦</h1>
          <p>填你想知嘅資料，幫你喺成個電腦庫入面搵返嗰部機。填多過一格就要全部啱先會顯示。</p>
        </div>
      </div>

      <section class="panel lookup-panel" aria-label="查找條件">
        <form id="lookup-form" class="lookup-grid" novalidate>
          <div class="field">
            <label for="lookup-barcodes">條碼</label>
            <input id="lookup-barcodes" name="bar_code" type="text" autocomplete="off" placeholder="例如 A1617015760">
          </div>
          <div class="field">
            <label for="lookup-location">位置</label>
            <input id="lookup-location" name="location" type="text" autocomplete="off" placeholder="例如 YIA 606">
          </div>
          <div class="field">
            <label for="lookup-model">型號</label>
            <input id="lookup-model" name="model_no" type="text" autocomplete="off" placeholder="例如 MACBOOK PRO">
          </div>
          <div class="field">
            <label for="lookup-group">類別</label>
            <select id="lookup-group" name="asset_group">
              <option value="">全部類別</option>
            </select>
          </div>
          <div class="field">
            <label for="lookup-brand">品牌</label>
            <select id="lookup-brand" name="brand">
              <option value="">全部品牌</option>
            </select>
          </div>
          <div class="field">
            <label for="lookup-serial">序號</label>
            <input id="lookup-serial" name="serial_no" type="text" autocomplete="off" placeholder="例如 FVFSPE06">
          </div>
          <div class="field">
            <label for="lookup-status">狀態</label>
            <select id="lookup-status" name="status">
              <option value="">全部狀態</option>
            </select>
          </div>
          <div class="lookup-actions">
            <button class="btn btn-primary" type="submit" id="lookup-submit">查找</button>
            <button class="btn btn-ghost" type="button" id="lookup-clear">清除</button>
          </div>
        </form>
        <p class="form-msg" id="lookup-msg" role="alert"></p>
      </section>

      <div class="toolbar">
        <div class="toolbar-group">
          <span id="lookup-count" class="field-hint">填啲資料落去就可以開始查找。</span>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table asset-table">
          <thead>
            <tr>
              <th scope="col">條碼</th>
              <th scope="col">位置</th>
              <th scope="col">品牌／型號</th>
              <th scope="col">類別</th>
              <th scope="col">序號</th>
              <th scope="col">到貨日期</th>
              <th scope="col">狀態</th>
              <th scope="col">負責人</th>
              <th class="col-narrow" scope="col"><span class="sr-only">操作</span></th>
            </tr>
          </thead>
          <tbody id="lookup-body">
            <tr><td colspan="9" class="empty">仲未搵過。</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 陳大文 · 香港</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/asset-detail.js"></script>
  <script src="js/lookup.js"></script>
</body>
</html>
