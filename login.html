<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員登入 — 陳大文</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/members.css">
</head>
<body class="members-page">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">CW</span>
        <span class="brand-name">陳大文</span>
      </a>
      <nav class="site-nav" aria-label="主要選單">
        <a href="index.html">返首頁</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap auth-main">
      <div>
        <form class="auth-card" id="login-form" novalidate>
          <h1>會員登入</h1>
          <p class="auth-sub">用管理員派俾你嘅帳戶名同密碼登入。</p>

          <div class="field">
            <label for="username">帳戶名</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" autocapitalize="none"
                   spellcheck="false" required>
          </div>

          <div class="field">
            <label for="password">密碼</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password"
                     autocomplete="current-password" required>
              <button type="button" class="toggle-pw" id="toggle-pw"
                      aria-label="顯示密碼">顯示</button>
            </div>
          </div>

          <p class="form-msg" id="form-msg" role="alert" aria-live="assertive"></p>

          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">登入</button>
        </form>

        <p class="auth-aside">
          連續輸錯 5 次，個帳戶會暫時鎖 15 分鐘。唔記得密碼？搵管理員重設。
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 陳大文 · 香港</p>
      <p class="footer-links"><a href="index.html">返首頁</a></p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
