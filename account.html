<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員中心 — 陳大文</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/members.css">
</head>
<body class="members-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">CW</span>
        <span class="brand-name">陳大文</span>
      </a>
      <nav class="site-nav" aria-label="主要選單">
        <a href="index.html">返首頁</a>
        <a href="assets.html">資產管理</a>
        <a href="lookup.html">查找</a>
        <a href="#" id="logout-link">登出</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap admin-main">
      <div class="page-head">
        <div>
          <h1>會員中心</h1>
          <p id="welcome-line">載入緊…</p>
        </div>
      </div>

      <section class="panel" aria-labelledby="acc-title">
        <h2 id="acc-title">我嘅資料</h2>
        <dl class="profile-grid" id="profile-grid">
          <div><dt>姓名</dt><dd>—</dd></div>
          <div><dt>帳戶名</dt><dd>—</dd></div>
          <div><dt>身分</dt><dd>—</dd></div>
          <div><dt>上次登入</dt><dd>—</dd></div>
        </dl>
      </section>

      <section class="panel" id="admin-panel" hidden>
        <h2>管理工具</h2>
        <p class="panel-note">
          你係管理員，可以睇全部會員同登入紀錄。
        </p>
        <a class="btn btn-primary" href="admin.html">開管理後台</a>
      </section>

      <section class="panel">
        <h2>登出</h2>
        <p class="panel-note">
          登出之後要重新輸入密碼先可以再入。
        </p>
        <button class="btn btn-ghost" type="button" id="logout-btn">登出</button>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 陳大文 · 香港</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
